name: tests

# Kapan dijalankan: setiap pull request, dan setiap push ke main.
on:
  pull_request:
  push:
    branches: [main]

# Workflow ini hanya perlu membaca kode.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    env:
      # Server CI tidak punya layar; Qt menggambar jendela di memori saja.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: pytest
